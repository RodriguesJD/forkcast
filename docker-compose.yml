services:
  forkcast-web:
    build: .
    # CI publishes this image on every merge to main; Watchtower (started by the
    # eth-grid-trader compose on the box) recreates labelled containers when it changes.
    image: ghcr.io/rodriguesjd/forkcast:latest
    container_name: forkcast-web
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # All host interfaces, on purpose: the LAN sees it at http://aut-macbookpro181.local:5002
    # (no Tailscale needed) and `tailscale serve` proxies the same port to the tailnet.
    # Docker's nat rules bypass firewalld, so this really is open to the whole LAN; the
    # router must never port-forward it (docs/deploy.md). 5002: clinch has 5001 and 8001.
    ports: ["5002:3000"]
    # Optional: Claude reads recipes out of photos and out of pages without recipe data.
    # Put the key in ~/forkcast/.env on the box (one line: ANTHROPIC_API_KEY=sk-ant-...);
    # compose reads .env next to this file. The key never goes in git or in the image.
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    # The SQLite database and its nightly backups. A named volume survives image updates,
    # `docker compose up -d`, Watchtower recreating the container, and reboots. Only
    # `docker compose down -v` or `docker volume rm` would delete it. Compose prefixes the
    # project name, so on the box it is `forkcast_forkcast-data` (docs/deploy.md).
    volumes:
      - forkcast-data:/data
    restart: unless-stopped

volumes:
  forkcast-data:
