# Forkcast static site. Port 80 inside the container; compose publishes it on loopback only.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite emits hashed asset names, so these are safe to cache for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else: serve the file if it exists, otherwise the app shell. index.html
    # itself must not be cached, or a deploy would not be seen until the browser gives up.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
